# Keeps the SHA-pinned actions and the worker's Python dependencies current: Dependabot opens a PR
# with the new commit SHA (and version comment); the tests workflow runs on it before you merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /worker
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
