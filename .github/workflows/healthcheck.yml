name: healthcheck

# Manual only: probes every source from a GitHub-hosted runner.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  healthcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r requirements.txt
      - name: Probe every source from a GitHub-hosted runner
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: python -m prop_worker.healthcheck --require-db --json healthcheck.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: healthcheck
          path: worker/healthcheck.json
